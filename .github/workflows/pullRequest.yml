name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest  # This will use the latest macOS runner

    steps:
      - uses: actions/checkout@v2  # Check out your code

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      # Set up the latest version of Xcode
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'  # Automatically picks the latest stable Xcode version

      # Install Ruby and set the Ruby version to 3.x (required for Bundler 2.5.4)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'  # Use Ruby 3.0 or higher (adjust as needed)

      # Install Bundler
      - name: Install Bundler
        run: gem install bundler -v 2.5.4  # Install a compatible Bundler version

      # Install required gems specified in the Gemfile
      - name: Install gems
        run: bundle install

      # Run Tests (No Cache)
      - name: Run Tests (No Cache)
        run: bundle exec fastlane unit_test
